apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: demo-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable 1 : un ancien pod part d abord, le service reste
      # disponible. 0 serait plus strict mais incompatible avec un cluster
      # a 2 workers.
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      # Le spread remplace l anti-affinity dure : il garantit l etalement a
      # 2 replicas ET autorise le HPA a monter a 3, 4 ou 5.
      # nodeTaintsPolicy Honor est indispensable : sans lui, le master tainte
      # est compte comme un domaine vide et le 3e pod reste Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: demo-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Nom LOGIQUE : kustomize le reecrit en ghcr.io/...:tag.
          # Aucun tag ici, donc aucune derive possible.
          image: demo-app
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            # 50m et non 10m : le HPA cible un pourcentage des requests.
            # Avec 10m le seuil serait a 3 millicores et n importe quelle
            # requete declencherait le scale-up maximum.
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}